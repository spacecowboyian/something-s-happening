name: Verify PR Deployment

on:
  workflow_run:
    workflows: ["PR Preview Deployment"]
    types:
      - completed

permissions:
  contents: read
  pull-requests: write

jobs:
  verify-deployment:
    # Only run if the PR Preview Deployment succeeded
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Get PR number
        id: pr
        run: |
          # Get PR number from the workflow run
          PR_NUMBER=$(gh pr list --head "${{ github.event.workflow_run.head_branch }}" --state open --json number --jq '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR found for branch ${{ github.event.workflow_run.head_branch }}"
            exit 1
          fi
          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for GitHub Pages deployment
        run: |
          echo "Waiting 30 seconds for GitHub Pages to deploy..."
          sleep 30

      - name: Verify PR deployment
        env:
          BASE_URL: https://${{ github.repository_owner }}.github.io/something-s-happening/pr-${{ steps.pr.outputs.number }}
        run: |
          echo "Testing deployment at: $BASE_URL"
          npm run test:deployment

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Comment on PR with verification results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.number }};
            const repoName = 'something-s-happening';
            const previewUrl = 'https://' + context.repo.owner + '.github.io/' + repoName + '/pr-' + prNumber + '/';
            const wasSuccessful = '${{ job.status }}' === 'success';
            
            const commentBody = wasSuccessful
              ? '✅ **Deployment verification passed!**\n\n' +
                'The PR preview has been successfully deployed and verified.\n\n' +
                '🔗 Preview URL: ' + previewUrl + '\n\n' +
                'All pages are loading correctly and responding as expected.'
              : '❌ **Deployment verification failed**\n\n' +
                '⚠️ The deployment completed but verification tests failed.\n\n' +
                '🔗 Preview URL: ' + previewUrl + '\n\n' +
                '**Possible causes:**\n' +
                '- GitHub Pages may not be enabled for this repository\n' +
                '- The site may not be publicly accessible yet\n' +
                '- There may be issues with the deployed code\n\n' +
                '**To enable GitHub Pages:**\n' +
                '1. Go to Settings → Pages\n' +
                '2. Set Source: "Deploy from a branch"\n' +
                '3. Select Branch: `gh-pages`, directory: `/ (root)`\n' +
                '4. Click Save\n\n' +
                'Check the [workflow run](' + context.payload.workflow_run.html_url + ') for details.';
            
            // Check if a verification comment already exists
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });
            
            const verificationComment = comments.find(c => 
              c.user.type === 'Bot' && 
              c.body.includes('Deployment verification')
            );
            
            if (verificationComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: verificationComment.id,
                body: commentBody
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
            }
